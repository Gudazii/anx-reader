name: Build Android 120Hz APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter_ver
        run: |
          echo "version=$(cat .github/flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_ver.outputs.version }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n & codegen
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Anx-Reader-120Hz-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anx-Reader-120Hz-arm64
          path: build/app/outputs/flutter-apk/Anx-Reader-120Hz-arm64.apk
          if-no-files-found: error
